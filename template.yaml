AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Job Signal - serverless job ingestion and query pipeline

Resources:
  JobSignalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JobSignal
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: job-signal-ingest
      CodeUri: src/ingest/
      Handler: app.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref JobSignalTable
      Policies:
        # Least privilege: get_item for dedup, BatchWriteItem (what batch_writer
        # sends under the hood), update_item for counters.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchWriteItem
                - dynamodb:UpdateItem
              Resource: !GetAtt JobSignalTable.Arn

  SummarizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: job-signal-summarize
      CodeUri: src/summarize/
      Handler: app.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref JobSignalTable
      Policies:
        # Least privilege: query the COUNTER partition, write the SUMMARY item.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt JobSignalTable.Arn

  JobSignalStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: job-signal-pipeline
      DefinitionUri: statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        IngestFunctionArn: !GetAtt IngestFunction.Arn
        SummarizeFunctionArn: !GetAtt SummarizeFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref IngestFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SummarizeFunction
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Name: job-signal-daily-trigger
            Description: Trigger the Job Signal pipeline once per day
            Input: "{}"

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: job-signal-query
      CodeUri: src/query/
      Handler: app.lambda_handler
      Runtime: python3.13
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref JobSignalTable
      Policies:
        # Read path only ever calls Query, so no Scan or GetItem.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt JobSignalTable.Arn
      Events:
        GetJobs:
          Type: HttpApi
          Properties:
            Path: /jobs
            Method: get
        GetTrends:
          Type: HttpApi
          Properties:
            Path: /trends
            Method: get

Outputs:
  TableName:
    Value: !Ref JobSignalTable
  StateMachineArn:
    Value: !Ref JobSignalStateMachine
  ApiUrl:
    Description: Base URL for the Job Signal query API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
